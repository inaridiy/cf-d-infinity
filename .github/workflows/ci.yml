name: ci

# push と PR のたびには走らせない。遅く、GitHub に負荷を掛けるからである。
# 変更を main へ入れる前の検査は、手元で scripts/check.sh を流す。
# ここは、手で起動したときと、週に 1 回の形式モデルの全探索だけである。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/cf-d-infinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cf-d-infinity/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 単体、シミュレータ、workerd の結合テスト、黒箱検査の検出力
      - run: npx vitest run
      # 課金行数の上限
      - run: ROWCOST=1 npx vitest run test/rowcost.test.ts
      - name: sqllogictest select1-5
        run: test/slt/fetch.sh && SLT_LIMIT=1000000 npx vitest run test/slt.test.ts
      # 公開物が作れること。lib/ のビルドと、tarball に入るファイルの確認
      - run: npm pack --dry-run

  cli:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/create-cf-d-infinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/create-cf-d-infinity/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  changes:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.filter.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        # 直前のコミットとの差分に specs/ があるかを見る。最初のコミットでは回す
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1 || ! git diff --quiet HEAD~1 HEAD -- specs; then
            echo "specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "specs=false" >> "$GITHUB_OUTPUT"
          fi

  models:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: specs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # 全モデルの green の全探索、red の反例、witness、run テスト
      - run: ./check.sh
