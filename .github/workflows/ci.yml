name: ci

# 自動では走らせない。遅く、GitHub に負荷を掛けるからである。
# 変更を main へ入れる前の検査は、手元で scripts/check.sh を流す (specs/ を変えたら、形式モデルの検査も流れる)。
# ここは、手で起動したときだけ走る。別の計算機で同じ検査を確かめたいときに使う。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/cf-d-infinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cf-d-infinity/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 単体、シミュレータ、workerd の結合テスト、黒箱検査の検出力
      - run: npx vitest run
      # 課金行数の上限
      - run: ROWCOST=1 npx vitest run test/rowcost.test.ts
      - name: sqllogictest select1-5
        run: test/slt/fetch.sh && SLT_LIMIT=1000000 npx vitest run test/slt.test.ts
      # 公開物が作れること。lib/ のビルドと、tarball に入るファイルの確認
      - run: npm pack --dry-run

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/create-cf-d-infinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/create-cf-d-infinity/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: specs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # 全モデルの green の全探索、red の反例、witness、run テスト
      - run: ./check.sh
